[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-ecosystem-pulse"
version = "1.1.0"
description = "Read-only, dependency-free collector and dashboard for the current Solana mainnet-beta state."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["solana", "rpc", "dashboard", "monitoring", "blockchain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]

[project.scripts]
solana-pulse = "report:main"

[tool.setuptools]
py-modules = ["report"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["test_report.py"]
pythonpath = ["."]
